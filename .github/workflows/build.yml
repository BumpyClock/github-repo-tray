name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WinUI and test core
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
          architecture: x64

      - name: Restore WinUI app
        run: dotnet restore .\src\GitHubTray.App\GitHubTray.App.csproj -p:Platform=x64

      - name: Build WinUI app
        run: dotnet build .\src\GitHubTray.App\GitHubTray.App.csproj --configuration Debug --no-restore -p:Platform=x64 -p:ContinuousIntegrationBuild=true

      - name: Restore core tests
        run: dotnet restore .\tests\GitHubTray.Core.Tests\GitHubTray.Core.Tests.csproj

      - name: Run core tests
        run: dotnet test .\tests\GitHubTray.Core.Tests\GitHubTray.Core.Tests.csproj --configuration Debug --no-restore -p:ContinuousIntegrationBuild=true
