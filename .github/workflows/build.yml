name: Windows build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WinUI and test core and App state
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
          architecture: x64

      - name: Restore solution
        run: dotnet restore .\GitHubTray.slnx -p:Platform=x64

      - name: Check runtime identifier selection
        run: .\scripts\Test-RuntimeIdentifiers.ps1

      - name: Build solution
        run: dotnet build .\GitHubTray.slnx --configuration Debug --no-restore -p:Platform=x64 -p:ContinuousIntegrationBuild=true

      - name: Run core tests
        run: dotnet test .\tests\GitHubTray.Core.Tests\GitHubTray.Core.Tests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 -p:ContinuousIntegrationBuild=true

      - name: Test persistence without reflection-based JSON
        run: dotnet test .\tests\GitHubTray.Core.Tests\GitHubTray.Core.Tests.csproj --configuration Debug --no-restore --filter "FullyQualifiedName~SettingsStoreTests|FullyQualifiedName~DashboardCacheStoreTests" -p:Platform=x64 -p:JsonSerializerIsReflectionEnabledByDefault=false -p:ContinuousIntegrationBuild=true

      - name: Run App tests
        run: dotnet test .\tests\GitHubTray.App.Tests\GitHubTray.App.Tests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 -p:ContinuousIntegrationBuild=true

      - name: Run App state tests
        run: dotnet test .\tests\GitHubTray.AppState.Tests\GitHubTray.AppState.Tests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 -p:ContinuousIntegrationBuild=true

      - name: Publish NativeAOT app
        run: dotnet publish .\src\GitHubTray.App\GitHubTray.App.csproj --configuration Release --runtime win-x64 --no-restore -p:Platform=x64 -p:PublishProfile= -p:ContinuousIntegrationBuild=true -warnaserror --output .\artifacts\nativeaot\win-x64

      - name: Verify NativeAOT executable
        run: .\scripts\Test-NativeAot.ps1 -PublishDirectory .\artifacts\nativeaot\win-x64
